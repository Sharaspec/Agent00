<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Daybloom: plan your day, log workouts and meals, and grow together with friends." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Daybloom</title>
    <script>
      try {
        var t = localStorage.getItem('daybloom-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
